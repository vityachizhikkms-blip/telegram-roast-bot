services:
  - type: web
    name: telegram-roast-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: DATABASE_PATH
        value: bot.db
      - key: SPICY_MODE
        value: "true"
